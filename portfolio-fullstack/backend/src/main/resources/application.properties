spring.application.name=portfolio-backend
server.port=8080

# Default: in-memory H2 database so the project runs with zero setup.
# For PostgreSQL run with:  -Dspring-boot.run.profiles=postgres
spring.datasource.url=jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# CORS: the React dev server
portfolio.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Token needed to read saved contact messages (GET /api/admin/messages)
portfolio.admin-token=${ADMIN_TOKEN:change-me}

# Optional email notification when someone sends a message.
# Set MAIL_ENABLED=true and the SMTP values below (for Gmail use an App Password).
portfolio.mail.enabled=${MAIL_ENABLED:false}
portfolio.mail.to=${MAIL_TO:abhondve682@gmail.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
